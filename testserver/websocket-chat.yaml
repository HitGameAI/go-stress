# WebSocket 聊天室压测
protocol: websocket
url: ws://localhost:3000/ws/chat
method: POST

concurrency: 50
requests: 1000
timeout: 10s

# 模拟聊天消息
body: |
  {
    "action": "chat",
    "message_id": {{seq}},
    "data": {
      "content": "{{randomString 10}}: {{randomSentence}}",
      "user_id": "user_{{randomInt 1 100}}",
      "room_id": "room_{{randomInt 1 5}}",
      "timestamp": {{unix}}
    }
  }

advanced:
  realtime_port: 8088
  enable_breaker: false
  enable_retry: true
  max_retries: 3
  ramp_up: 10s

storage: memory
